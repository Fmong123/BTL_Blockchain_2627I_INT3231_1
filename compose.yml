services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: banquyenso
      POSTGRES_PASSWORD: ${BQS_POSTGRES_PASSWORD:?Set BQS_POSTGRES_PASSWORD for local development}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - bqs_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d banquyenso"]
      interval: 2s
      timeout: 3s
      retries: 15
volumes:
  bqs_data:
